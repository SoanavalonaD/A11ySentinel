# Cloud Run environment. Used with:  gcloud run deploy --env-vars-file env.deploy.yaml
#
# A file rather than --set-env-vars because PROSPECT_POOL contains commas, and
# comma is gcloud's delimiter for that flag. The documented workaround is a
# "^@^" delimiter prefix, but gcloud on Windows runs through cmd.exe, where "^"
# is itself the escape character, so the prefix never survives. A file has no
# escaping rules at all.
#
# No secrets belong here. Secrets go in Secret Manager.

GOOGLE_CLOUD_PROJECT: "a11ysentinel"
GOOGLE_CLOUD_LOCATION: "us-central1"

# Vertex serves the Gemini 3.x family from the `global` endpoint. A 3.x model
# id returns NOT_FOUND against a regional endpoint, which reads as "this model
# does not exist" and is misleading. Unrelated to where Firestore and Cloud Run
# live, which is GOOGLE_CLOUD_LOCATION above.
VERTEX_LOCATION: "global"
GOOGLE_GENAI_USE_VERTEXAI: "true"
GEMINI_MODEL: "gemini-3.7-flash"

ARTIFACTS_BUCKET: "a11ysentinel-artifacts"

# Candidates the agent chooses between. The choice is the agent's; the pool
# is ours — that separation is what lets the same code demo safely and run
# for real. These pages are our own seeded demo site, served from this same
# service at /demo, which satisfies outreach guard 3: the video runs against
# a domain we control. They carry different violation counts on purpose, so
# the picker has a genuine choice to make.
PROSPECT_POOL: "https://a11ysentinel-pipeline-708226575684.us-central1.run.app/demo/index.html,https://a11ysentinel-pipeline-708226575684.us-central1.run.app/demo/livraison.html,https://a11ysentinel-pipeline-708226575684.us-central1.run.app/demo/carte.html"
PROSPECT_SCAN_LIMIT: "4"

# Model Armor screens page content for prompt injection before it reaches
# Gemini. The template is created once:
#
#   gcloud model-armor templates create a11ysentinel-screen #     --location=us-central1 --project=a11ysentinel #     --pi-and-jailbreak-filter-settings-enforcement=enabled #     --pi-and-jailbreak-filter-settings-confidence-level=LOW_AND_ABOVE #     --malicious-uri-filter-settings-enforcement=enabled #     --rai-settings-filters="filterType=DANGEROUS,confidenceLevel=MEDIUM_AND_ABOVE"
#
# Screening fails open on purpose — see a11ysentinel/armor.py for why that is
# the opposite choice from PII redaction, which fails closed.
MODEL_ARMOR_ENABLED: "true"
MODEL_ARMOR_LOCATION: "us-central1"
MODEL_ARMOR_TEMPLATE: "a11ysentinel-screen"
