# Cloud Run environment. Used with:  gcloud run deploy --env-vars-file env.deploy.yaml
#
# A file rather than --set-env-vars because PROSPECT_POOL contains commas, and
# comma is gcloud's delimiter for that flag. The documented workaround is a
# "^@^" delimiter prefix, but gcloud on Windows runs through cmd.exe, where "^"
# is itself the escape character, so the prefix never survives. A file has no
# escaping rules at all.
#
# No secrets belong here. Secrets go in Secret Manager.

GOOGLE_CLOUD_PROJECT: "a11ysentinel"
GOOGLE_CLOUD_LOCATION: "us-central1"

# Vertex serves the Gemini 3.x family from the `global` endpoint. A 3.x model
# id returns NOT_FOUND against a regional endpoint, which reads as "this model
# does not exist" and is misleading. Unrelated to where Firestore and Cloud Run
# live, which is GOOGLE_CLOUD_LOCATION above.
VERTEX_LOCATION: "global"
GOOGLE_GENAI_USE_VERTEXAI: "true"
GEMINI_MODEL: "gemini-3.7-flash"

ARTIFACTS_BUCKET: "a11ysentinel-artifacts"

# Candidates the agent chooses between. The choice is the agent's; the pool is
# ours. For the demo video this MUST be domains we control — outreach guard 3.
# These W3C pages are published specifically for testing accessibility tools,
# so they are safe for development.
PROSPECT_POOL: "https://www.w3.org/WAI/demos/bad/before/home.html,https://www.w3.org/WAI/demos/bad/before/news.html,https://www.w3.org/WAI/demos/bad/before/tickets.html,https://www.w3.org/WAI/demos/bad/before/survey.html"
PROSPECT_SCAN_LIMIT: "4"
